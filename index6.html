<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flex box</title>
  <style>
    body {
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: space-evenly;
      align-items: center;
      overflow-x: hidden;
    }

    .container {
      height: auto;
      width: 250px;
      border: 2px solid black;
      display: flex;
      /* flex-direction: column-reverse; */
      /* flex-direction: column; */
      gap: 12px;

      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      justify-content: space-around;
      justify-content: space-evenly;
      justify-content: space-between;
      padding: 10px;
      box-shadow: 0px 0px 100px red;
      overflow-y: scroll;
    }

    .box {
      height: 60px;
      width: 60px;
      border: 2px solid red;
      margin: 10px 10px;
      /* padding: 10px 0; */
      /* margin: 10px 0; */
    }

    #box-1 {
      background-color: brown;
    }

    .box1 {
      background-color: yellow;
    }
  </style>
</head>

<body>
  <!-- flex box -->

  <div class="container">
    <div class="box">
      Box 1
    </div>
    <div class="box">
      Box 2
    </div>
    <div class="box"> Box 3</div>
  </div>
  <div class="container">
    <div class="box box1" id="box-1">
      Box 1
    </div>
    <div class="box">
      Box 2
    </div>
    <div class="box"> Box 3</div>
    <div class="box"> Box 3</div>
    <div class="box"> Box 3</div>
    <div class="box"> Box 3</div>
    <div class="box"> Box 3</div>
    <div class="box"> Box 3</div>
    <div class="box"> Box 3</div>
    <div class="box"> Box 3</div>
    <div class="box"> Box 3</div>
  </div>

  <!-- box shadow -> x-axis y-axis intensity color -->
</body>

</html>
