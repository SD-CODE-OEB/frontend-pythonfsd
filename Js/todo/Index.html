<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo list</title>
  <!-- <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script> -->
  <link rel="stylesheet" href="Styles.css">
</head>

<body class="h-screen m-4">
  <h1 class="text-5xl font-bold">Todo list</h1>
  <button type="button" class="p-3 bg-blue-500 rounded-lg" id="add-task-btn">Add Todo</button>
  <ul id="task-list">

  </ul>
  <form class="todo-form">
    <label for="todo-input">Todo text</label>
    <input type="text" name="todo-input" id="todo-input" class="" /> <br>
    <button type="submit">Create Todo</button>
  </form>
  <script src="todolist.js"></script>
</body>

</html>
