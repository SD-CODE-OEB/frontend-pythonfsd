<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grids</title>
  <style>
    .container {
      display: grid;
      /* Creates 3 columns: 200px wide, 1 fractional unit, and 2 fractional units */
      grid-template-columns: repeat(4, 1fr);
      /* Creates 2 rows: 100px tall and 200px tall */
      grid-template-rows: 100px 100px;
      border: 2px solid black;
      justify-items: center;
      align-items: center;
    }

    .box {
      height: 80px;
      width: 80px;
      border: 2px solid black;
    }

    #box1 {
      grid-column: span 1;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="box" id="box1">
      box
    </div>
    <div class="box" id="box2">
      box
    </div>
    <div class="box">
      box
    </div>
    <div class="box">
      box
    </div>
    <div class="box">
      box
    </div>
    <div class="box">
      box
    </div>
  </div>
</body>

</html>
