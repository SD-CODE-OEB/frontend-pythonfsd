<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo list</title>
  <!-- <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script> -->
  <link rel="stylesheet" href="./src/style.css">
</head>

<body class="m-6">
  <h1 class="text-4xl font-bold mb-4">Todo list</h1>
  <button type="button"
    class="min-h-[44px] px-4 py-2 bg-blue-600 sm:hover:bg-blue-700 text-white rounded-lg cursor-pointer"
    id="add-task-btn">Add Todo</button>

  <ul id="task-list" class="my-4"></ul>

  <form class="todo-form flex gap-2 items-center" style="display: none;">
    <label for="todo-input">Todo text:</label>
    <input type="text" name="todo-input" id="todo-input" class="border px-3 py-2 rounded text-base" />
    <button type="submit"
      class="min-h-[44px] px-4 py-2 bg-green-600 sm:hover:bg-green-700 text-white rounded-lg cursor-pointer">Create
      Todo</button>
  </form>

        add to cart
      </div>
      <div class="wishlist cursor-pointer border bg-yellow-400 text-black">
        Wishlist
      </div>
    </div>
  </div> -->

  <script type="module" src="./src/todolist.js"></script>
</body>

</html>
