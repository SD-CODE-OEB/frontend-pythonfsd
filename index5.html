<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learning CSS part 2</title>
  <style>
    .box {
      border: 2px solid black;
      height: 80px;
      width: 240px;
      /* margin: 50px; */
      margin-top: 10px;
      margin-bottom: 10px;
      margin-left: 10px;
      margin-right: 10px;
      padding: 50px;
      padding-left: 20px;
      padding-bottom: 10px;
      padding-right: 20px;
      padding-top: 10px;
      padding: 10px 20px;
      margin: 30px 50px;
    }

    .box {
      margin: 80px;
      border: 10px solid yellow;
    }
  </style>
</head>

<body>
  <h1>Learning CSS</h1>
  <!-- A box model -->
  <div class="box">
    this is a box
  </div>
  <!-- flex box -->

  <div class="container">
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
  </div>
</body>

</html>
