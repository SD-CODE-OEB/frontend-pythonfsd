<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bento Grid Layout</title>
  <style>
    body {
      height: 100vh;
      width: 100%;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      display: grid;
      grid-template-columns: auto auto;
      grid-template-rows: repeat(4, 1fr);
      gap: 20px;
    }

    .box {
      background-color: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      padding: 32px 72px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 18px;
      color: #64748b;
    }

    .box1 {
      grid-column: 1;
      grid-row: span 2;
    }

    .box2 {
      grid-column: 2;
      grid-row: 1;
    }

    .box3 {
      grid-column: 2;
      grid-row: 2;
    }

    .box4 {
      grid-column: 1;
      grid-row: span 2;
    }

    .box5 {
      grid-column: 2;
      grid-row: span 2;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="box box1">Box 1</div>
    <div class="box box2">Box 2</div>
    <div class="box box3">Box 3</div>
    <div class="box box4">Box 4</div>
    <div class="box box5">Box 5</div>
  </div>
</body>

</html>
