<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  Table
  <!-- tables -->
  <table border=1>
    <tr>
      <!--headings  -->
      <th>
        Name
      </th>
      <th>
        Email
      </th>
    </tr>
    <tr>
      <td>
        Rahul
      </td>
      <td>
        Simon
      </td>
      <td>
        John
      </td>
      <!-- values -->
    </tr>
  </table>

  Forms
  <input type="text" />
  <input type="email" />
  <input type="number" />

  <input type="checkbox" />

  <input type="radio" />

  <input type="button" />


  <form>
    <h2>Form here</h2>
    <div>

      <label for="UserName">
        Username
      </label>
      <input type="text" name="UserName" id="UserName" />
    </div>
    <div>

      <label for="Email">
        Email
      </label>
      <input type="email" name="Email" id="Email" />
    </div>
    <div>

      <label for="Ph.no">
        Phone number
      </label>
      <input type="number" name="Ph.no" id="Ph.no">
    </div>

    <div>
      <label for="gender">
        Gender
      </label>
      <div>

        <label for="man">Men</label>
        <input type="radio" name="gender" id="man" />
      </div>
      <div>

        <label for="women">Women</label>
        <input type="radio" name="gender" id="women" />
      </div>

      <div>
        <label for="food">
          Whats your favorite food ?
        </label>
      </div>
      <div>
        <label for="rice">
          Rice
        </label>
        <input type="checkbox" name="food" id="rice">
      </div>
      <div>
        <label for="biryani">
          Biryani
        </label>
        <input type="checkbox" name="food" id="biryani">
      </div>
      <div>
        <label for="mandi">
          Mandi
        </label>
        <input type="checkbox" name="food" id="mandi">
      </div>
    </div>
    <div>
      <input type="color">
      <input type="date" />
      <input type="datetime-local" />
      <input type="file" name="" id="">
    </div>



  </form>

</body>

</html>
